# 시스템 전반 설정
database:
  path: data/rfp.db

crawl:
  # 폴링 주기 (분) — 정부 R&D 공고는 보통 일 1회 갱신이라 1시간이면 충분
  interval_minutes: 60
  # 사이트별 요청 간격 (초) — 부하 방지
  request_delay_seconds: 2
  # 한 번에 가져올 최대 공고 수 (소스별 override 가능 — sources.{name}.max_per_source)
  max_per_source: 50
  # 요청 타임아웃 (초) — 2026-05-27: 30→20초로 단축 (hang 차단)
  # base.py의 retry 3회 × 20초 = 최악 60초 per URL (이전 90초 → 60초)
  timeout_seconds: 20
  # User-Agent (예의상)
  user_agent: "RFP-Targeter/0.1 (research; contact: rfp@enkiwhitehat.com)"

# 활성화할 소스
sources:
  # 파이프라인 검증용 샘플 데이터 (실데이터 크롤러 완성되면 false)
  mock:
    enabled: false
    base_url: "https://example.test"

  # 실데이터 크롤러
  # bizinfo (기업마당): SPA — 정적 HTML 받아도 행 0 (JS로 채움).
  # Playwright 추가 필요. data.go.kr OpenAPI 미제공.
  # 중기부 본부는 MSS 어댑터가 이미 흡수, 지자체 공고는 보안 매칭률 낮음 → 후순위.
  bizinfo:
    enabled: false
    base_url: "https://www.bizinfo.go.kr"
  kisa:
    enabled: true
    base_url: "https://www.kisa.or.kr"

  # IITP는 robots.txt 전면 금지. data.go.kr 공식 API 경유 (config/secrets.yaml 에 키 필요)
  iitp:
    enabled: true
    base_url: "https://apis.data.go.kr"      # 실제 endpoint는 secrets.yaml 또는 어댑터 기본값
    # 2026-05-27: 30→20으로 추가 축소 (25분 timeout cancelled 만성화 차단)
    # 매시 cron 용량: 20건 = 페이지 2개 × 첨부 평균 3초 = 1~2분 안에 끝
    # 대형 백필 필요 시 별도 1회성 스크립트로 max_per_source 무시하고 돌릴 것
    max_per_source: 20

  # 중소벤처기업부 사업공고 (data.go.kr 1421000, 일 한도 100)
  mss:
    enabled: true
    base_url: "https://apis.data.go.kr"
    max_per_source: 50                        # 일 호출 한도 100 보수적 운용

  # KOSA — 2026-05-27 비활성화 (사용자 결정).
  # 사유: 활성 20건 평균 본문 907자(가장 짧음), 첨부 통합률 0%, 평균 매칭 7.1개.
  # cbIdx=381(입찰안내) 본문이 너무 빈약 + cbIdx=382(유관기관)는 세미나/수요조사 잡음.
  # 영양가 대비 비용 손실 — 다른 6개 source 가 보안 R&D 충분히 커버.
  kosa:
    enabled: false
    base_url: "https://www.sw.or.kr"
    max_per_source: 50

  # KRIT — 국방기술진흥연구소 과제관리시스템 PMS (Nexacro SPA)
  # [2026-05-29] dtims.krit.re.kr (정적 HTML, 2024년 정지) → pms.krit.re.kr (Nexacro SPA, 활성)
  # Playwright headless chromium 으로 SPA 실행 후 DOM 추출.
  # 캐러셀 홈 페이지 1 (4건). 후속: next 버튼 클릭으로 5페이지 확장 가능.
  krit:
    enabled: true
    base_url: "https://pms.krit.re.kr"
    max_per_source: 30

  # KOICA — 한국국제협력단 ODA 조달정보 (data.go.kr 3039908 OpenAPI)
  # 2026-05-26 비활성화: apis.data.go.kr 게이트웨이도 빈 응답, openapi.koica.go.kr 직접 endpoint
  # 도 unreachable (network connect timeout 44초 낭비). 데이터 0건. cron 시간 절약.
  # nebid.koica.go.kr 직접 HTML 크롤러 작성 시 다시 enable.
  koica:
    enabled: false
    base_url: "https://apis.data.go.kr"
    max_per_source: 50

  # NIPA — 정보통신산업진흥원 사업·입찰공고
  # 2026-05-27: 50 → 30 축소. 첨부 통합 추가(2026-05-26)로 어댑터당 시간 +10분 → cron timeout 재발.
  # KISA(7m) + IITP(3m) + MSS(9m) + KOSA(4m) + KRIT(2m) + NIPA(10m) = 35분 → 30분 timeout 초과.
  # 30건이면 NIPA 6분 → 합 31분 → 안전 마진 확보.
  nipa:
    enabled: true
    base_url: "https://www.nipa.kr"
    # 2026-05-27: 30→20 추가 축소 (timeout cancelled 만성화 차단)
    max_per_source: 20

  # NTIS — IITP와 100% 중복 (NTIS 고유 0건) → 비활성화
  ntis:
    enabled: false
    base_url: "https://apis.data.go.kr"
    max_per_source: 500

  # G2B — 나라장터 입찰공고 통합 채널 (KOICA 발주분 흡수용)
  # 2026-05-26 비활성화: 4개 endpoint (용역/공사/물품/외자) 모두 401 Unauthorized.
  # 기존 data_go_kr.service_key는 G2B(1230000) 활용신청 미승인 상태 — 별도 키 필요.
  # 활용신청 승인 후 secrets.yaml에 g2b.service_key 추가하고 enable.
  g2b:
    enabled: false
    base_url: "https://apis.data.go.kr"
    max_per_source: 50

# 점수 가중치 (합 1.0)
# keyword 비중 ↑: 회사 본업 매칭도가 가장 결정적
# [2026-05-27] consortium → eligibility 교체 (변별력 확보)
scoring_weights:
  keyword: 0.35        # 회사 핵심 키워드 매칭도
  budget: 0.10         # 예산 정합
  eligibility: 0.20    # 자격 적합도 (이전 consortium — 변별력 확보)
  competitor: 0.20     # 경쟁 영역 난이도
  trl: 0.15            # 회사 기술 TRL 적합

# 초안 자동 생성 임계점
auto_draft:
  enabled: true
  min_total_score: 70  # 100점 만점 기준

# 슬랙 알림 (Incoming Webhook) — 평일 09~21 KST 영업시간 매시 cron 사이클 발사
# 영업시간 외 신규는 alerted_at=NULL로 누적 → 다음 영업일 09시 묶음 발송
# [2026-05-28] 18 → 21 확대 + notify_crawl_complete 도 영업시간 가드로 통일
alert:
  slack_enabled: true               # secrets.yaml의 slack.webhook_url 필요
  dashboard_url: "https://yellowcornsalad.github.io/RFP-Targeter/"  # GitHub Pages 정적 사이트
  # [2026-05-29 사용자 요청] 크롤 완료 메시지 OFF. 신규 공고 알림(80+ AND 1억+)만 유지.
  crawl_complete_enabled: false     # 매 사이클 "크롤 완료" 요약 메시지 발송 여부
  # [2026-05-29 사용자 요청] 크롤 실패(소스 에러) 시에는 경보 발사 (성공은 조용).
  crawl_failure_enabled: true       # source 에러 1+ 시 🚨 Slack 경보 (영업시간 가드)
  # [2026-05-29 사용자 요청] 매일 아침 1회 '정상 가동' 하트비트 (크롤완료 OFF 보완).
  daily_heartbeat_enabled: true     # 매일 daily_heartbeat_hour 시 첫 사이클에 1회 발송
  daily_heartbeat_hour: 9           # KST 기준 시각 (기본 09시). meta dedup 으로 하루 1회.
  business_hours:
    start: 9                        # 09시부터
    end: 21                         # 21시까지 (포함) — 사용자 요청 2026-05-28
    weekdays_only: true             # 평일만

# 회사 프로필 추출 대상
profile_extraction:
  homepage_url: "https://www.enkiwhitehat.com"
  extra_urls: []
