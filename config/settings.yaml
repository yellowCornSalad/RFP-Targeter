# 시스템 전반 설정
database:
  path: data/rfp.db

crawl:
  # 폴링 주기 (분) — 정부 R&D 공고는 보통 일 1회 갱신이라 1시간이면 충분
  interval_minutes: 60
  # 사이트별 요청 간격 (초) — 부하 방지
  request_delay_seconds: 2
  # 한 번에 가져올 최대 공고 수 (소스별 override 가능 — sources.{name}.max_per_source)
  max_per_source: 50
  # 요청 타임아웃 (초)
  timeout_seconds: 30
  # User-Agent (예의상)
  user_agent: "RFP-Targeter/0.1 (research; contact: rfp@enkiwhitehat.com)"

# 활성화할 소스
sources:
  # 파이프라인 검증용 샘플 데이터 (실데이터 크롤러 완성되면 false)
  mock:
    enabled: false
    base_url: "https://example.test"

  # 실데이터 크롤러
  # bizinfo (기업마당): SPA — 정적 HTML 받아도 행 0 (JS로 채움).
  # Playwright 추가 필요. data.go.kr OpenAPI 미제공.
  # 중기부 본부는 MSS 어댑터가 이미 흡수, 지자체 공고는 보안 매칭률 낮음 → 후순위.
  bizinfo:
    enabled: false
    base_url: "https://www.bizinfo.go.kr"
  kisa:
    enabled: true
    base_url: "https://www.kisa.or.kr"

  # IITP는 robots.txt 전면 금지. data.go.kr 공식 API 경유 (config/secrets.yaml 에 키 필요)
  iitp:
    enabled: true
    base_url: "https://apis.data.go.kr"      # 실제 endpoint는 secrets.yaml 또는 어댑터 기본값
    max_per_source: 500                       # 페이지당 10건 × 50 = 약 6~9개월치 (2026.01 IITP 대형 공고까지 커버)

  # 중소벤처기업부 사업공고 (data.go.kr 1421000, 일 한도 100)
  mss:
    enabled: true
    base_url: "https://apis.data.go.kr"
    max_per_source: 50                        # 일 호출 한도 100 보수적 운용

  # KOSA — 한국SW산업협회 정부지원사업
  # robots.txt 전체 차단 → Googlebot UA로 우회(어댑터 내부 처리)
  kosa:
    enabled: true
    base_url: "https://www.sw.or.kr"
    max_per_source: 50

  # KRIT — 국방기술진흥연구소 핵심기술 과제공고 (DTiMS 게시판)
  krit:
    enabled: true
    base_url: "https://dtims.krit.re.kr"
    max_per_source: 30

  # KOICA — 한국국제협력단 ODA 조달정보 (data.go.kr 3039908 OpenAPI)
  # serviceKey는 secrets.yaml의 data_go_kr.service_key 재사용
  # 2026-05: openapi.koica.go.kr 직접 endpoint 죽음 → apis.data.go.kr 게이트웨이로 우회.
  koica:
    enabled: true
    base_url: "https://apis.data.go.kr"
    max_per_source: 50

  # NIPA — 정보통신산업진흥원 사업·입찰공고
  nipa:
    enabled: true
    base_url: "https://www.nipa.kr"
    max_per_source: 50

  # NTIS — 2026-05 검증 결과 IITP와 100% 데이터 중복 (NTIS 고유 0건).
  # _is_iitp 역필터가 의도대로 작동 안 함 → 실제 운영에서는 IITP에 다 들어옴.
  # 추후 NTIS endpoint가 IITP와 다른 부처 데이터를 제공하기 시작하면 enabled: true.
  ntis:
    enabled: false
    base_url: "https://apis.data.go.kr"
    max_per_source: 500

# 점수 가중치 (합 1.0)
# keyword 비중 ↑: 회사 본업 매칭도가 가장 결정적
scoring_weights:
  keyword: 0.35        # 회사 핵심 키워드 매칭도 (강화)
  budget: 0.10         # 예산 정합 (약화 — 본문에 안 나오는 경우 다수)
  consortium: 0.20     # 컨소시엄 구성 부담
  competitor: 0.20     # 경쟁자 적은 정도(난이도)
  trl: 0.15            # 회사 기술 TRL 적합

# 초안 자동 생성 임계점
auto_draft:
  enabled: true
  min_total_score: 70  # 100점 만점 기준

# 슬랙 알림 (Incoming Webhook) — 매 크롤 사이클 신규 보안 공고 즉시 푸시
alert:
  slack_enabled: true               # secrets.yaml의 slack.webhook_url 필요
  dashboard_url: "http://localhost:8501"  # 클라우드 배포 시 실제 URL로 교체

# 회사 프로필 추출 대상
profile_extraction:
  homepage_url: "https://www.enkiwhitehat.com"
  extra_urls: []
