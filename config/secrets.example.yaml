# Anthropic Claude API — /rfp 스킬 자동 호출용 (LLM 1차 초안 작성)
# 발급: https://console.anthropic.com/ → Settings → API Keys
# 비용 안내 (claude-opus-4-7 + adaptive thinking + xhigh effort, 2026-05 기준):
#   - 첫 호출: 약 $0.28~$0.55 (≈ 390~770원)
#   - 5분 내 반복 (시스템 캐시 적중): 약 $0.26~$0.53 (≈ 370~740원)
#   - 정확한 비용은 호출 후 초안 푸터에 실측치 표시됨
anthropic:
  api_key: "???"                # sk-ant-api03-... 형식
  model: "claude-opus-4-7"      # 최신·최강. 다른 옵션: claude-sonnet-4-6 (50% 저렴, 약간 낮은 품질)
  effort: "xhigh"               # opus-4-7 전용: xhigh > high > medium > low > max
                                # opus-4-6, sonnet-4-6: high 권장 (xhigh 미지원)
                                # 자동 폴백: xhigh 설정해도 비-4.7 모델이면 high로 자동 변환
