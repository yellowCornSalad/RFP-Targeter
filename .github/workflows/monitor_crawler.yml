name: Monitor Crawler Health

# 크롤러가 주간 시간(평일 09~18 KST = UTC 00~09) 매시 정상 작동하는지
# 30분마다 자동 검증. 60분 초과 정지 또는 cancelled 패턴 감지 시 슬랙 알림.
#
# rfp_crawler 스킬과 같은 로직 (scripts/monitor_crawler.py) — 둘이 같은 동작 보장.

on:
  schedule:
    # 매 30분 (하루 종일, 주말 포함) — 발화 안정성 ↑
    # 자주 도는 cron 은 GitHub Actions schedule 더 안정적으로 발화.
    # 점검·알림은 monitor_crawler.py 안에서 영업시간 가드.
    # 만료 dismiss / 자동 crawl 복구는 24/7 작동.
    - cron: '*/30 * * * *'
  workflow_dispatch:           # 수동 트리거 (즉시 점검용)

concurrency:
  group: monitor-crawler
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5         # 빠른 점검 — 5분 안에 끝나야 함

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main            # 모니터 스크립트는 항상 main 의 최신 버전

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore profile.yaml (점수 산정 모듈 import 의존)
        env:
          PROFILE_YAML_B64: ${{ secrets.PROFILE_YAML_B64 }}
        run: |
          if [ -n "$PROFILE_YAML_B64" ]; then
            mkdir -p config
            echo "$PROFILE_YAML_B64" | base64 -d > config/profile.yaml
          fi

      - name: Run monitor
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          # gh CLI 가 워크플로우에서 자동 인증되도록 GH_TOKEN
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING:   utf-8
        run: |
          python scripts/monitor_crawler.py
        # exit 1 (이슈 감지) 시 step 빨간불 — 슬랙 알림은 스크립트가 알아서 발사
