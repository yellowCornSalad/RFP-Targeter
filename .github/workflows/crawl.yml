name: Hourly Crawl

on:
  schedule:
    # [2026-05-27 사용자 결정] 30분 → 1시간 주기로 복귀
    # 매시 정각 발화. 누락 시 monitor 가 70분 임계 후 자동 dispatch.
    - cron: '0 * * * *'
  # 수동 트리거 — Actions 탭에서 "Run workflow" 버튼 클릭 가능 (테스트용)
  workflow_dispatch:

# 동시 실행 방지 — 이전 실행 끝나기 전에 새 cron 안 돌게
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40                    # [2026-06-01] 25→40. KISA 상세 fetch가 kisa.or.kr 느린 시간대 21분+ → 25분에 NIPA 직전 cancelled 만성화. 요청당 20초+retry라 무한hang 불가 → 느려도 완주시키는 게 재dispatch 루프보다 나음. (B: KISA 30건으로 평소 13분)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Playwright chromium (KRIT PMS SPA 크롤링용)
        # KRIT 가 Nexacro SPA (pms.krit.re.kr) 라 일반 HTTP 크롤링 불가.
        # Playwright headless chromium 으로 SPA 실행 후 DOM 추출.
        # --with-deps: Ubuntu 시스템 라이브러리도 설치 (libnss3, libxkbcommon 등)
        run: |
          python -m playwright install chromium --with-deps

      - name: Restore profile.yaml from secret (회사 프로필)
        env:
          PROFILE_YAML_B64: ${{ secrets.PROFILE_YAML_B64 }}
        run: |
          if [ -n "$PROFILE_YAML_B64" ]; then
            mkdir -p config
            echo "$PROFILE_YAML_B64" | base64 -d > config/profile.yaml
            echo "✅ profile.yaml restored from secret ($(wc -l < config/profile.yaml) lines)"
          else
            echo "⚠️ PROFILE_YAML_B64 secret 미설정 — profile.example.yaml로 폴백"
          fi

      - name: Run crawl pipeline
        env:
          # Supabase PostgreSQL
          DATABASE_URL:        ${{ secrets.DATABASE_URL }}
          # 공공데이터포털 (IITP/NTIS/MSS 통합 키)
          DATA_GO_KR_KEY:      ${{ secrets.DATA_GO_KR_KEY }}
          # Anthropic Claude API (AI 초안 생성용 — 크롤 자체엔 불필요하지만 동일 secrets 사용)
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          # Slack webhook (신규 공고 알림)
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          # Python 한글 인코딩
          PYTHONIOENCODING:    utf-8
        run: |
          python scripts/run_once.py

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-log-${{ github.run_number }}
          path: |
            *.log
          retention-days: 7
          if-no-files-found: ignore
