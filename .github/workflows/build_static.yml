name: Build Static Site

# 정적 사이트 빌드 + GitHub Pages 배포.
# 매시 정각 5분에 자동 빌드 (crawl 끝난 직후).
# 결과는 gh-pages 브랜치로 push → GitHub Pages가 자동 서빙.
#
# ⚠️ 빌드는 v1.0 릴리스 브랜치 코드로 (스냅샷 동결).
# main 브랜치 변경은 즉시 반영 안 됨 — v1.0으로 cherry-pick 또는 v1.1로 분기 후 교체.
# Schedule cron은 default branch(main)에서만 발화하지만, 빌드 시 v1.0 checkout.

on:
  schedule:
    - cron: '5 * * * *'      # 매시 5분 (default branch에서 발화) — 백업 트리거
  # [2026-05-29] 크롤 완료 직후 자동 빌드 — 대시보드 "마지막 동기화" 신선도 보장.
  # GitHub schedule(:05)이 자주 지연·스킵되는 문제를 보정 (cron-job.org 아님, 내부 연동).
  workflow_run:
    workflows: ["Hourly Crawl"]
    types: [completed]
  push:
    branches: [v1.0]          # v1.0 변경 시도 빌드
    paths:
      - 'scripts/build_static.py'
      - 'scripts/static_templates/**'
      - '.github/workflows/build_static.yml'
      - 'config/keywords.yaml'                          # 필터 키워드 변경 시 즉시 재빌드
      - 'src/rfp_targeter/filters/security_filter.py'   # 필터 로직 변경 시 즉시 재빌드
      - 'src/rfp_targeter/scoring/**'                   # 점수 산정 모듈 변경 시
      - 'src/rfp_targeter/attachments/**'               # 예산/날짜/첨부 추출 모듈 변경 시
      - 'src/rfp_targeter/crawlers/**'                  # 어댑터 변경 시 (백필 영향)
  workflow_dispatch:           # 수동 트리거 (main에서도 가능)
    inputs:
      ref:
        description: '빌드할 브랜치 (기본 v1.0)'
        required: false
        default: 'v1.0'

concurrency:
  group: build-static
  cancel-in-progress: false

permissions:
  contents: write              # gh-pages 브랜치 push

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_run(크롤 완료) 트리거는 크롤이 '성공'했을 때만 빌드.
    # 그 외 트리거(schedule/push/dispatch)는 항상 빌드.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout v1.0 release branch
        uses: actions/checkout@v4
        with:
          # workflow_dispatch로 다른 ref 지정 가능, 기본은 v1.0 (workflow_run/schedule 포함)
          ref: ${{ github.event.inputs.ref || 'v1.0' }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore profile.yaml from secret (회사 프로필)
        # ⚠️ 이 단계 없으면 build_static.py 가 config/profile.example.yaml 로 폴백되어
        # data.json 의 portfolio 한글이 mojibake (cp949↔utf-8 깨짐) 로 들어가
        # 카드 상세의 "회사 매칭 강점" 이 모든 공고에서 0건 매칭됨.
        # [2026-05-29] crawl.yml 의 동일 단계 미러링 — 동일 PROFILE_YAML_B64 secret 사용.
        env:
          PROFILE_YAML_B64: ${{ secrets.PROFILE_YAML_B64 }}
        run: |
          if [ -n "$PROFILE_YAML_B64" ]; then
            mkdir -p config
            echo "$PROFILE_YAML_B64" | base64 -d > config/profile.yaml
            echo "✅ profile.yaml restored from secret ($(wc -l < config/profile.yaml) lines)"
          else
            echo "⚠️ PROFILE_YAML_B64 secret 미설정 — profile.example.yaml로 폴백 (강점 매칭 0건 예상)"
          fi

      - name: Build static site
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/build_static.py
          echo "Build artifacts:"
          ls -la site/
          echo "data.json size:"
          du -h site/data.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true   # gh-pages 브랜치 항상 1 commit으로 정리
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: static site build ${{ github.run_number }}'
