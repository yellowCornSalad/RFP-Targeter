# Streamlit 네이티브 테마 — BMW 톤 (검정 액센트 + 흰 배경 + 회색 보조)
# st.button(type="primary") / 체크박스 / 슬라이더 / multiselect 칩 등 모든
# 네이티브 위젯이 이 색상 따름. CSS 오버라이드보다 우선이라 여기서 결정.

[theme]
base = "light"
primaryColor          = "#000000"   # BMW 검정 — primary 액센트 (버튼·체크박스·슬라이더·칩)
backgroundColor       = "#e8e8e8"   # 메인 회색 배경 (BMW 카드 떠보이게)
secondaryBackgroundColor = "#ffffff" # 사이드바 흰색 (메인 회색과 대비)
textColor             = "#111111"   # 본문 검정 텍스트
font                  = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
